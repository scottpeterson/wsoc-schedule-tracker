name: Hourly schedule check

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC; GitHub often runs scheduled jobs a few minutes late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check schedules and rebuild the site
        run: |
          python check_schedules.py
          python build_site.py
      - name: Commit and push when anything changed
        run: |
          git config user.name "schedule-tracker"
          git config user.email "schedule-tracker@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Hourly check $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
