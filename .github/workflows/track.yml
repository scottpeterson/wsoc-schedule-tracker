name: Schedule check

on:
  schedule:
    - cron: "17 0,12 * * *"   # twice a day at 00:17 and 12:17 UTC (7:17 PM and 7:17 AM Central during daylight time); GitHub often runs scheduled jobs late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check schedules and rebuild the site
        run: |
          python check_schedules.py
          python build_site.py
      - name: Commit and push when anything changed
        run: |
          git config user.name "schedule-tracker"
          git config user.email "schedule-tracker@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Scheduled check $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
